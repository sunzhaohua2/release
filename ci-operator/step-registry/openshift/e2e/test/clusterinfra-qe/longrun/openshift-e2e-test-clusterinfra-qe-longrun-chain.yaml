chain:
  as: openshift-e2e-test-clusterinfra-qe-longrun
  env:
  - name: TEST_FILTERS_CLUSTERINFRASTRUCTURE
    default: "disruptive&&!autoscaler"
    documentation: |
      It is used to filter the cluster-api-actuator-pkg cases, for step openshift-e2e-test-clusterinfra-qe.
  - name: TEST_SCENARIOS
    default: Cluster_Infrastructure(?!\s+CAS)
    documentation: |-
      It is used to filter the openshift-test-private cases, for step openshift-extended-test-longduration. It's a RE pattern and is passed to the 'grep -E'.
  - name: TEST_TIMEOUT
    default: "90"
    documentation: |-
      It is used for the openshift-test-private cases, for step openshift-extended-test-longduration. It's a time-out duration for each test-case execution in minutes.
  steps:
  - chain: cucushift-installer-check-cluster-health
  - ref: openshift-extended-test-longduration
  - ref: openshift-e2e-test-clusterinfra-qe
  - ref: openshift-e2e-test-qe-report
  documentation: |-
    Execute long duration e2e tests from QE and cluster-api-actuator-pkg repo, which include golang, cucushift, ...(more to add)
